server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Game assets cache well; HTML should revalidate.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|ogg|mp3|wav|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
